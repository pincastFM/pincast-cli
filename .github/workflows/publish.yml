# A tag v<version> publishes @pincast/cli to npm, after the same checks, with provenance.
# npm trusts this workflow by its file name (trusted publishing), so no publish token is stored
# anywhere. npm can only trust a workflow once a package's first version exists, so a version
# that is already on npm is skipped here instead of failing the run. RELEASING.md has the steps.
# The package depends on one exact version of @pincast/api, so that version has to be on npm first.
name: Publish
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: An npm that supports trusted publishing
        run: npm install -g npm@11.21.2
      - name: Node 22.14.0 and npm 11.5.1, or later
        run: |
          node -e '
            const at = (v) => v.replace(/^v/, "").split(".").map(Number)
            const atLeast = (v, min) => { const a = at(v), b = at(min); for (let i = 0; i < 3; i++) if (a[i] !== b[i]) return a[i] > b[i]; return true }
            const npm = require("child_process").execSync("npm --version").toString().trim()
            console.log("node " + process.version + ", npm " + npm)
            if (!atLeast(process.version, "22.14.0") || !atLeast(npm, "11.5.1")) { console.error("trusted publishing needs Node 22.14.0 and npm 11.5.1 or later"); process.exit(1) }
          '
      - name: The tag names the package's version
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - name: The changelog has an entry for it
        run: node scripts/changelog.mjs --check
      - name: The pinned @pincast/api is one exact version, and it is on npm
        run: |
          pin="$(node -p "require('./package.json').dependencies['@pincast/api']")"
          if ! echo "$pin" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "@pincast/api has to be pinned to one exact version, not $pin"
            exit 1
          fi
          found="$(npm view "@pincast/api@$pin" version --registry https://registry.npmjs.org 2>/dev/null || true)"
          if [ "$found" != "$pin" ]; then
            echo "@pincast/api $pin isn't on npm yet. Publish it first."
            exit 1
          fi
          echo "@pincast/api $pin is on npm"
      - name: Install @pincast/api
        run: npm install --no-package-lock --no-audit --no-fund --registry https://registry.npmjs.org
      - run: npm test
      - name: Is this version already on npm
        id: npm
        run: |
          spec="$(node -p "const p = require('./package.json'); p.name + '@' + p.version")"
          version="$(node -p "require('./package.json').version")"
          found="$(npm view "$spec" version --registry https://registry.npmjs.org 2>/dev/null || true)"
          if [ "$found" = "$version" ]; then
            echo "$spec is already on npm, nothing to publish"
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.npm.outputs.published != 'true'
        run: npm publish --provenance --access public
